<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoneyMate - ประวัติธุรกรรม</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F8F5B">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="history">

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="logo-badge">฿</span> MoneyMate</div>
      <nav class="side-nav">
        <a href="index.html" data-nav-link="dashboard"><span class="ic">🏠</span> หน้าหลัก</a>
        <a href="history.html" data-nav-link="history"><span class="ic">🧾</span> ประวัติ</a>
        <a href="budget.html" data-nav-link="budget"><span class="ic">🎯</span> งบประมาณ</a>
        <a href="goals.html" data-nav-link="goals"><span class="ic">🏆</span> เป้าหมาย</a>
      </nav>
      <div class="side-footer">
        <span class="muted" style="font-size:12.5px;">ธีม</span>
        <div class="theme-toggle">
          <button data-theme-btn="light" title="โหมดสว่าง">☀️</button>
          <button data-theme-btn="dark" title="โหมดมืด">🌙</button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div class="brand"><span class="logo-badge">฿</span> MoneyMate</div>
        <div class="theme-toggle">
          <button data-theme-btn="light" title="โหมดสว่าง">☀️</button>
          <button data-theme-btn="dark" title="โหมดมืด">🌙</button>
        </div>
      </div>

      <div class="page-header">
        <div>
          <h1>ประวัติธุรกรรม</h1>
          <p>ค้นหาและกรองรายจ่ายทั้งหมดของคุณ</p>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-danger" id="deleteAllBtn">🗑️ ลบทั้งหมด</button>
          <button class="btn btn-primary" id="addExpenseBtn">➕ เพิ่มรายจ่าย</button>
        </div>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 ค้นหารายละเอียดหรือหมวดหมู่...">
        <select id="filterCategory"><option value="all">ทุกหมวดหมู่</option></select>
        <select id="filterMonth"><option value="all">ทุกเดือน</option></select>
      </div>

      <div class="card">
        <div class="card-title">รายการรายจ่ายทั้งหมด (ใหม่ → เก่า)</div>
        <div class="tx-list" id="historyList"></div>
        <div class="empty-state" id="historyEmpty" style="display:none;">
          <span class="em">🧾</span>
          <p>ไม่พบรายการที่ตรงกับเงื่อนไข</p>
        </div>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" data-nav-link="dashboard"><span class="ic">🏠</span>หน้าหลัก</a>
    <a href="history.html" data-nav-link="history"><span class="ic">🧾</span>ประวัติ</a>
    <a href="budget.html" data-nav-link="budget"><span class="ic">🎯</span>งบประมาณ</a>
    <a href="goals.html" data-nav-link="goals"><span class="ic">🏆</span>เป้าหมาย</a>
  </nav>

  <!-- Expense Modal (shared markup, used for add/edit here too) -->
  <div class="modal-overlay" id="expenseModal">
    <div class="modal-box">
      <div class="modal-head"><h3 id="expenseModalTitle">เพิ่มรายจ่าย</h3></div>
      <div class="modal-alert" id="expenseAlert"></div>
      <div class="field">
        <label>จำนวนเงิน (บาท)</label>
        <input type="number" id="expenseAmountInput" min="0" step="0.01" placeholder="เช่น 150">
      </div>
      <div class="field">
        <label>หมวดหมู่</label>
        <div class="category-picker" id="expenseCategoryPicker"></div>
      </div>
      <div class="field">
        <label>รายละเอียด</label>
        <input type="text" id="expenseNoteInput" placeholder="เช่น ข้าวกลางวัน">
      </div>
      <div class="field">
        <label>วันที่</label>
        <div class="date-select-row">
          <select id="expenseDaySelect" aria-label="วัน"></select>
          <select id="expenseMonthSelect" aria-label="เดือน"></select>
          <select id="expenseYearSelect" aria-label="ปี พ.ศ."></select>
        </div>
        <input type="hidden" id="expenseDateInput">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="expenseCancelBtn">ยกเลิก</button>
        <button class="btn btn-danger" id="expenseDeleteBtn" style="display:none;">ลบ</button>
        <button class="btn btn-primary" id="expenseSaveBtn">บันทึก</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box confirm-box">
      <div class="modal-head"><h3>ยืนยันการทำรายการ</h3></div>
      <p id="confirmMessage">คุณแน่ใจหรือไม่?</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="confirmNoBtn">ยกเลิก</button>
        <button class="btn btn-danger" id="confirmYesBtn">ยืนยัน</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/transactions.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
