<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoneyMate - เป้าหมายการออม</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F8F5B">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="goals">

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="logo-badge">฿</span> MoneyMate</div>
      <nav class="side-nav">
        <a href="index.html" data-nav-link="dashboard"><span class="ic">🏠</span> หน้าหลัก</a>
        <a href="history.html" data-nav-link="history"><span class="ic">🧾</span> ประวัติ</a>
        <a href="budget.html" data-nav-link="budget"><span class="ic">🎯</span> งบประมาณ</a>
        <a href="goals.html" data-nav-link="goals"><span class="ic">🏆</span> เป้าหมาย</a>
      </nav>
      <div class="side-footer">
        <span class="muted" style="font-size:12.5px;">ธีม</span>
        <div class="theme-toggle">
          <button data-theme-btn="light" title="โหมดสว่าง">☀️</button>
          <button data-theme-btn="dark" title="โหมดมืด">🌙</button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div class="brand"><span class="logo-badge">฿</span> MoneyMate</div>
        <div class="theme-toggle">
          <button data-theme-btn="light" title="โหมดสว่าง">☀️</button>
          <button data-theme-btn="dark" title="โหมดมืด">🌙</button>
        </div>
      </div>

      <div class="page-header">
        <div>
          <h1>เป้าหมายการออม</h1>
          <p>ตั้งเป้าหมาย เก็บเงินไปให้ถึงฝัน</p>
        </div>
        <button class="btn btn-primary" id="addGoalBtn">➕ ตั้งเป้าหมายใหม่</button>
      </div>

      <div class="goals-grid" id="goalsList"></div>
      <div class="empty-state" id="goalsEmpty" style="display:none;">
        <span class="em">🏆</span>
        <p>ยังไม่มีเป้าหมายการออม เริ่มตั้งเป้าหมายแรกของคุณกันเถอะ</p>
        <button class="btn btn-primary" id="addGoalBtnEmpty">ตั้งเป้าหมายใหม่</button>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" data-nav-link="dashboard"><span class="ic">🏠</span>หน้าหลัก</a>
    <a href="history.html" data-nav-link="history"><span class="ic">🧾</span>ประวัติ</a>
    <a href="budget.html" data-nav-link="budget"><span class="ic">🎯</span>งบประมาณ</a>
    <a href="goals.html" data-nav-link="goals"><span class="ic">🏆</span>เป้าหมาย</a>
  </nav>

  <!-- Add/Edit Goal Modal -->
  <div class="modal-overlay" id="goalModal">
    <div class="modal-box">
      <div class="modal-head"><h3 id="goalModalTitle">ตั้งเป้าหมายใหม่</h3></div>
      <div class="field">
        <label>ชื่อเป้าหมาย</label>
        <input type="text" id="goalNameInput" placeholder="เช่น เก็บเงินซื้อหูฟัง">
      </div>
      <div class="field">
        <label>จำนวนเงินเป้าหมาย (บาท)</label>
        <input type="number" id="goalTargetInput" min="0" step="0.01" placeholder="เช่น 3000">
      </div>
      <div class="field">
        <label>วันที่ต้องการให้ถึงเป้าหมาย (ไม่บังคับ)</label>
        <input type="date" id="goalDateInput">
      </div>
      <div class="field-error" id="goalError"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="goalCancelBtn">ยกเลิก</button>
        <button class="btn btn-primary" id="goalSaveBtn">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- Add Money Modal -->
  <div class="modal-overlay" id="addMoneyModal">
    <div class="modal-box">
      <div class="modal-head"><h3>เพิ่มเงินออมให้ "<span id="addMoneyGoalName"></span>"</h3></div>
      <div class="field">
        <label>จำนวนเงิน (บาท)</label>
        <input type="number" id="addMoneyInput" min="0" step="0.01" placeholder="เช่น 200">
      </div>
      <div class="field-error" id="addMoneyError"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="addMoneyCancelBtn">ยกเลิก</button>
        <button class="btn btn-primary" id="addMoneySaveBtn">บันทึก</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box confirm-box">
      <div class="modal-head"><h3>ยืนยันการทำรายการ</h3></div>
      <p id="confirmMessage">คุณแน่ใจหรือไม่?</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="confirmNoBtn">ยกเลิก</button>
        <button class="btn btn-danger" id="confirmYesBtn">ยืนยัน</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/goals.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
